<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Output Tag</title>
    <style>
        body {
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>
        W3Schools
    </h1>
    <h2>
        HTML Output Tag
    </h2>
    <form oninput="sumresult.value=parseInt(A.value)+parseInt(B.value)+parseInt(C.value)">
        <input type="number" name="A" value="50">+
        <input type="range" name="B" value="0">+
        <input type="number" name="C" value="30">
        <br>
        <!-- output tag -->
        Result: <output name="sumresult"></output>
    </form>
</body>

</html>
