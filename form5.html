<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datalist tags</title>
</head>

<body>
    <form action="">
        <label for="">Your Cars Name</label>
        <input list="cars">
        <datalist id="cars">
            <option value="BMS"></option>
            <option value="Bentley"></option>
            <option value="Mercedes"></option>
            <option value="Audi"></option>
        </datalist>
    </form>
</body>

</html>
